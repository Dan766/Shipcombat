<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2714%27 font-size=%2714%27%3E%E2%9A%93%3C/text%3E%3C/svg%3E" />
<title>Ship Combat — Playable Slice</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1418; }
  #view, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { pointer-events: none; }
  #hud {
    position: absolute; left: 18px; top: 18px; z-index: 2;
    background: rgba(10, 20, 26, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 3px; padding: 12px 14px; min-width: 232px;
    font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
    color: #eef3f4; pointer-events: none;
  }
  #hud .row { display: flex; justify-content: space-between; gap: 16px; }
  #hud .row span { color: rgba(255,255,255,0.62); }
  #hud .keys {
    margin-top: 9px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.14);
    font-size: 11px; color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="overlay"></canvas>
  <div id="hud"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
